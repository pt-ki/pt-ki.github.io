repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint
        args: ["-r", "~MD022,~MD034"]
  - repo: local
    hooks:
      - id: jekyll-build
        name: jekyll build
        entry: bundle exec jekyll build --trace
        language: system
        pass_filenames: false
      - id: htmlproofer
        name: htmlproofer
        entry: bash -c 'bundle exec jekyll build && bundle exec htmlproofer ./_site --disable-external'
        language: system
        pass_filenames: false
